name: Render automático Legadia

on:
  workflow_dispatch:
  push:
    paths:
      - 'render-auto-trigger.txt'
      - 'scripts/render_legadia_hf.py'
      - 'scripts/render_legadia_wan.py'
      - 'prompts/legadia_video_request.json'
      - '.github/workflows/render_legadia_auto.yml'
  pull_request:
    paths:
      - 'render-auto-trigger.txt'
      - 'scripts/render_legadia_hf.py'
      - 'scripts/render_legadia_wan.py'
      - 'prompts/legadia_video_request.json'
      - '.github/workflows/render_legadia_auto.yml'

concurrency:
  group: legadia-render-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sistema
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y ffmpeg fonts-dejavu-core

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install gradio_client edge-tts pillow numpy scipy

      - name: Renderizar mediante Wan2.1 gratuito
        id: render
        continue-on-error: true
        run: python scripts/render_legadia_wan.py

      - name: Guardar resultado o diagnóstico en el repositorio
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/render_status.json || true
          if [ -f outputs/LEGADIA_FINAL_1080P.mp4 ]; then
            SIZE=$(stat -c%s outputs/LEGADIA_FINAL_1080P.mp4)
            if [ "$SIZE" -lt 95000000 ]; then
              git add outputs/LEGADIA_FINAL_1080P.mp4
            fi
          fi
          git diff --cached --quiet || git commit -m 'Guardar resultado del render automático de Legadia'
          git push || true

      - name: Publicar archivo descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEGADIA_FINAL_1080P
          path: |
            outputs/LEGADIA_FINAL_1080P.mp4
            outputs/render_status.json
          if-no-files-found: warn
          retention-days: 7

      - name: Marcar fallo real
        if: steps.render.outcome == 'failure'
        run: exit 1
